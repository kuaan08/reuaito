name: Bootstrap rexauto and compile Reuaito

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-rexauto.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import verified original rexauto source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch arena/01a07629-rexauto https://github.com/Player124413/rexauto.git "$RUNNER_TEMP/upstream"
          actual="$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)"
          test "$actual" = "dac49b331f2632f0b050f469e35747721300b8b2" || { echo "::error::Upstream commit changed: $actual"; exit 1; }
          rsync -a --exclude='.git' --exclude='.github/workflows/**' "$RUNNER_TEMP/upstream/" "$GITHUB_WORKSPACE/"
          mkdir -p .github/workflows
          cat > .github/requirements-windows-build.txt <<'REQS'
          pyinstaller==6.16.0
          pywebview==6.1
          pillow==11.3.0
          REQS
          cat > REUAITO_BUILD.md <<'DOCS'
          # Reuaito

          Complete source imported from Player124413/rexauto, commit
          dac49b331f2632f0b050f469e35747721300b8b2.

          This fork retains the original MIT license, NOTICE, upstream
          credits and the independent supporting components. It does not
          include commercial Xbox 360 game files, keys or assets.

          ## Windows EXE

          GitHub Actions > Build Reuaito Windows EXE produces the
          Reuaito-Windows-x64 artifact containing reuaito.exe.

          The executable bundles the Python desktop application and its
          WebView frontend. It does NOT bundle the separate native ReXGlue
          SDK or Visual Studio C++/LLVM build tools. Configure these
          through the application's Setup screen. Successful packaging
          is not proof that any commercial Xbox 360 game can run.

          Original project: https://github.com/Player124413/rexauto
          DOCS
          # Workflow files are maintained with the authorized GitHub connection.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import pinned rexauto source and Windows packaging dependencies'
          git push origin HEAD:main

  first-windows-exe:
    needs: import-source
    runs-on: windows-2022
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native launcher requirements
        run: python -m pip install -r .github/requirements-windows-build.txt
      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q app.py rexauto.py gui extract.py heal.py
          python rexauto.py --help
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $buildArgs = @(
            '--noconfirm', '--onefile', '--windowed',
            '--name', 'reuaito',
            '--icon', 'gui/rexauto.ico',
            '--add-data', 'gui/index.html;gui',
            '--add-data', 'vendor/xenon-jumptables;xenon-jumptables',
            '--add-data', 'thirdparty/libmspack;thirdparty/libmspack',
            '--add-data', 'tools;tools',
            '--paths', 'gui',
            '--hidden-import', 'extract',
            '--hidden-import', 'heal',
            '--hidden-import', 'closure',
            '--hidden-import', 'codegen_patches',
            '--hidden-import', 'jt_landings',
            '--hidden-import', 'rexauto',
            '--hidden-import', 'detect_setjmp',
            '--hidden-import', 'server',
            '--hidden-import', 'setup',
            '--collect-all', 'webview',
            'app.py'
          )
          python -m PyInstaller @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Validate generated Windows executable
        shell: pwsh
        run: |
          $file = 'dist/reuaito.exe'
          if (!(Test-Path $file)) { throw 'Missing executable' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
          if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows PE' }
          Get-FileHash $file -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Reuaito-Windows-x64
          path: dist/reuaito.exe
          retention-days: 14
          if-no-files-found: error
